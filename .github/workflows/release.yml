name: Release

concurrency:
  group: release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        default: prerelease
        description: 'Type'
        options:
          - prerelease
          - prepatch
          - preminor
          - premajor
          - patch
          - minor
          - major
        required: true
        type: choice
      dry-run:
        default: false
        description: 'Dry Run'
        type: boolean

permissions:
  contents: write
  id-token: write

env:
  RELEASE: ${{ inputs.release || 'prerelease' }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      # Release exactly the commit CI tested. release-it needs the branch (not a detached
      # SHA) to push its release commit, so if main has moved on, skip: the newer commit's
      # own CI run triggers its own release.
      - name: Check Commit
        id: commit
        if: github.event_name == 'workflow_run'
        run: |
          if [ "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on from ${{ github.event.workflow_run.head_sha }}; skipping."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup
        if: steps.commit.outputs.current != 'false'
        uses: ./.github/actions/setup

      - name: Build
        if: steps.commit.outputs.current != 'false'
        run: npm run build

      - name: Release
        if: steps.commit.outputs.current != 'false'
        continue-on-error: ${{ env.RELEASE == 'prerelease' }}
        run: npm run release -- ${{ env.RELEASE }} --ci ${{ contains(fromJSON('["premajor", "preminor", "prepatch", "prerelease"]'), env.RELEASE) && '--preRelease=beta --plugins.@release-it/keep-a-changelog.keepUnreleased' || '' }} --dry-run=${{ inputs.dry-run || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
