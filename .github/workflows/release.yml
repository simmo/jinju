name: Release

concurrency:
  group: release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        default: prerelease
        description: 'Type'
        options:
          - prerelease
          - prepatch
          - preminor
          - premajor
          - patch
          - minor
          - major
        required: true
        type: choice
      dry-run:
        default: false
        description: 'Dry Run'
        type: boolean

permissions:
  contents: write
  id-token: write

env:
  RELEASE: ${{ inputs.release || 'prerelease' }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          # Full history, so the tested commit can be compared with the branch.
          fetch-depth: 0

      # Release only code CI tested. release-it needs the branch (not a detached SHA) to push
      # its release commit, so compare instead. Generated files are ignored: CI's Generate job
      # pushes badge updates (with GITHUB_TOKEN, so they never run CI themselves). Any other
      # change since the tested commit came from a push with its own CI run, which releases it.
      - name: Check Commit
        id: commit
        if: github.event_name == 'workflow_run'
        run: |
          if git diff --quiet "${{ github.event.workflow_run.head_sha }}" HEAD -- . ':(exclude).github/badges'; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has changed since ${{ github.event.workflow_run.head_sha }}; skipping."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup
        if: steps.commit.outputs.current != 'false'
        uses: ./.github/actions/setup

      - name: Build
        if: steps.commit.outputs.current != 'false'
        run: npm run build

      - name: Release
        if: steps.commit.outputs.current != 'false'
        continue-on-error: ${{ env.RELEASE == 'prerelease' }}
        run: npm run release -- ${{ env.RELEASE }} --ci ${{ contains(fromJSON('["premajor", "preminor", "prepatch", "prerelease"]'), env.RELEASE) && '--preRelease=beta --plugins.@release-it/keep-a-changelog.keepUnreleased' || '' }} --dry-run=${{ inputs.dry-run || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
