name: Setup
description:

inputs:
  node-version:
    description: Node.js version to use instead of the one in .nvmrc
    type: string

runs:
  using: 'composite'
  steps:
    - name: Setup
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ !inputs.node-version && '.nvmrc' || '' }}
        cache: 'npm'

    - name: Install
      shell: bash
      run: npm ci

    - name: Configure Git
      shell: bash
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"
